<style>* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #06060f; color: #eef; font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }

.side.on { display: flex; }
.side canvas { max-width: 100%; max-height: 62%; }

#overlay { position: fixed; inset: 0; display: none; z-index: 10; overflow-y: auto; overflow-x: hidden; padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); background: rgba(4, 4, 16, 0.72); }

.note { font-size: 12px; opacity: 0.75; line-height: 1.6; }

.sel { width: min(980px, 100%); }
.faces { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.face { position: relative; border-radius: 10px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); padding: 0; cursor: pointer; overflow: hidden; aspect-ratio: 5 / 6; }
.face canvas { width: 100%; height: 100%; display: block; }
.face.on { border-color: #ffd870; box-shadow: 0 0 10px rgba(255,216,112,0.6); }
.face.lock canvas { filter: brightness(0.15) grayscale(1); }
.face.lock::after { content: "？"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #aab; }
.face .lv { position: absolute; left: 2px; bottom: 2px; font-size: 11px; background: rgba(0,0,0,0.6); padding: 0 4px; border-radius: 4px; }

.detail .pic { position: relative; }

.detail .nm { font-size: 22px; font-weight: bold; }
.detail .role { font-size: 12px; opacity: 0.8; }
.detail .say { font-style: italic; color: #ffe8b0; }
.detail .k { color: #9fd8ff; font-weight: bold; margin-right: 4px; }
.ships { display: flex; gap: 8px; }
.ships div { flex: 1; text-align: center; font-size: 11px; background: rgba(0,0,0,0.35); border-radius: 10px; padding: 4px; }
.ships canvas { width: 100%; height: auto; display: block; }
input[type=range] { width: 100%; }
.vol { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; text-align: left; font-size: 15px; }
.vol b { min-width: 2em; text-align: center; }
@media (max-width: 560px) { .detail { grid-template-columns: minmax(0, 0.7fr) minmax(0, 1.3fr); } .detail .info { font-size: 12px; } .detail .nm { font-size: 18px; } }

  .ships div { padding: 2px; font-size: 10px; }
  .txt { font-size: 13px; line-height: 1.6; padding: 10px; }
