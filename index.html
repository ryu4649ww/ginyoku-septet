<meta name="description" content="七人のパイロットと七機の機体。地表の牢獄から仲間を救い出す縦スクロールシューティング。ブラウザーで無料・ログイン不要。">
<style>* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #06060f; color: #eef; font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; flex: none; background: #000; box-shadow: 0 0 30px rgba(120, 140, 255, 0.15); }
#cv { display: block; width: 100%; height: 100%; }
#btnPause { position: absolute; right: 4px; top: 54px; width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.35); color: #fff; font-size: 16px; display: none; z-index: 5; }
.side { flex: 1; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; min-width: 0; overflow: hidden; }
.side.on { display: flex; }
.side canvas { max-width: 100%; max-height: 62%; }
.side .nm { font-weight: bold; font-size: 15px; text-align: center; }
.side .sub { font-size: 12px; opacity: 0.8; text-align: center; }
.team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 220px; }
.team div { font-size: 12px; padding: 4px 6px; border-radius: 6px; background: rgba(255,255,255,0.06); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team div.cur { outline: 2px solid #fff; }
.team div.no { opacity: 0.3; }

#overlay { position: fixed; inset: 0; display: none; z-index: 10; overflow-y: auto; overflow-x: hidden; padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); background: rgba(4, 4, 16, 0.72); }
#overlay.on { display: flex; }
#overlay.clear { background: transparent; pointer-events: none; }
#overlay.clear .box { pointer-events: auto; }
.box { margin: auto; width: min(560px, 100%); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
h1 { margin: 0; font-size: clamp(30px, 9vw, 54px); letter-spacing: 0.06em; background: linear-gradient(180deg, #fff, #9fd8ff 55%, #6a7aff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 8px rgba(120,160,255,0.6)); }
.subt { font-size: clamp(13px, 3.6vw, 18px); color: #ffd870; letter-spacing: 0.1em; }
.en { font-size: 12px; letter-spacing: 0.4em; opacity: 0.7; }
h2 { margin: 0; font-size: clamp(18px, 5vw, 24px); color: #ffd870; }
.btn { font: inherit; font-size: 17px; font-weight: bold; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(160,190,255,0.5); background: linear-gradient(180deg, rgba(60,70,140,0.85), rgba(20,24,60,0.9)); color: #fff; cursor: pointer; min-height: 46px; }

.btn.small { font-size: 14px; padding: 8px 10px; min-height: 40px; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row .btn { flex: 1; min-width: 120px; }
.note { font-size: 12px; opacity: 0.75; line-height: 1.6; }
.txt { font-size: 15px; line-height: 1.9; text-align: left; background: rgba(0,0,0,0.35); padding: 14px; border-radius: 12px; white-space: pre-wrap; }
.menu { display: flex; flex-direction: column; gap: 8px; width: min(320px, 100%); margin: 0 auto; }

/* キャラ選択 */
.sel { width: min(980px, 100%); }
.faces { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.face { position: relative; border-radius: 10px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); padding: 0; cursor: pointer; overflow: hidden; aspect-ratio: 5 / 6; }
.face canvas { width: 100%; height: 100%; display: block; }
.face.on { border-color: #ffd870; box-shadow: 0 0 10px rgba(255,216,112,0.6); }
.face.lock canvas { filter: brightness(0.15) grayscale(1); }
.face.lock::after { content: "？"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #aab; }
.face .lv { position: absolute; left: 2px; bottom: 2px; font-size: 11px; background: rgba(0,0,0,0.6); padding: 0 4px; border-radius: 4px; }
.detail { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.3fr); gap: 10px; text-align: left; align-items: start; }
.detail .pic { position: relative; }
.detail .pic canvas.big { width: 100%; display: block; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.12), rgba(0,0,0,0.2)); }
.detail .info { display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.55; }
.detail .nm { font-size: 22px; font-weight: bold; }
.detail .role { font-size: 12px; opacity: 0.8; }
.detail .say { font-style: italic; color: #ffe8b0; }
.detail .k { color: #9fd8ff; font-weight: bold; margin-right: 4px; }
.ships { display: flex; gap: 8px; }
.ships div { flex: 1; text-align: center; font-size: 11px; background: rgba(0,0,0,0.35); border-radius: 10px; padding: 4px; }
.ships canvas { width: 100%; height: auto; display: block; }
input[type=range] { width: 100%; }
.vol { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; text-align: left; font-size: 15px; }
.vol b { min-width: 2em; text-align: center; }
@media (max-width: 560px) { .detail { grid-template-columns: minmax(0, 0.7fr) minmax(0, 1.3fr); } .detail .info { font-size: 12px; } .detail .nm { font-size: 18px; } }
@media (max-height: 520px) and (orientation: landscape) {
  .box { gap: 6px; } .btn { padding: 7px 10px; min-height: 38px; font-size: 15px; } h1 { font-size: 30px; }
  h2 { font-size: 16px; }
  .sel .faces { grid-template-columns: repeat(7, minmax(0, 44px)); justify-content: center; }
  .detail { grid-template-columns: minmax(0, 120px) minmax(0, 1fr); gap: 8px; } .detail .info { font-size: 11px; line-height: 1.35; gap: 2px; } .detail .nm { font-size: 16px; }
  .detail .pic canvas.big { max-height: 150px; object-fit: contain; }
  .ships canvas { max-height: 52px; width: auto !important; margin: 0 auto; }
  .ships div { padding: 2px; font-size: 10px; }
  .txt { font-size: 13px; line-height: 1.6; padding: 10px; }
}
#tFaces { max-width: 420px; margin: 4px auto 0; width: 100%; }
@media (max-height: 520px) and (orientation: landscape) { #tFaces { max-width: 300px; } }
@media (max-height: 380px) { #tFaces { display: none; } }

/* 難易度（4つ）：横の低い画面では2列に（2026-11-09 鬼を追加） */
@media (max-height: 520px) and (orientation: landscape) { .menu.diffs { display: grid; grid-template-columns: 1fr 1fr; width: min(520px, 100%); } .menu.diffs .small { grid-column: 1 / -1; } }

#btnBoost { position: absolute; right: 6px; bottom: min(58px, 14vh); width: min(54px, 12vh); height: min(54px, 12vh); border-radius: 50%; border: 2px solid rgba(255,150,60,0.8); background: rgba(60,20,0,0.45); color: #ffb060; font: bold 14px 'Segoe UI',sans-serif; display: none; z-index: 5; touch-action: none; }
#btnBoost b { position: absolute; right: -2px; top: -4px; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; background: #ff7a1a; color: #fff; font-size: 11px; }
#btnBoost.off { opacity: 0.35; }
#btnBoost.on { background: rgba(255,120,30,0.6); color: #fff; }
